name = "chat-translator-pro"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
POLAR_API = "https://api.polar.sh"
POLAR_ORG_ID = "ЗАПОЛНИТЬ_ПОСЛЕ_РЕГИСТРАЦИИ"
MONTHLY_CHARS = "500000"

# KV для счётчиков: id появится после `wrangler kv namespace create USAGE`
# [[kv_namespaces]]
# binding = "USAGE"
# id = "..."

# Секрет DEEPL_KEY задаётся командой `wrangler secret put DEEPL_KEY`, в файл не пишем.
