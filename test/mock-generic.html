<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Какой-то веб-чат (универсальный режим)</title>
  <style>
    body { margin: 0; font: 14px system-ui, sans-serif; }
    .x9f1 { padding: 16px 20%; display: flex; flex-direction: column; gap: 8px; }
    .k2a.zz7 { background: #f1f1f4; border-radius: 10px; padding: 8px; }
    .k2a.zz7 b { margin-right: 6px; }
    textarea { position: fixed; bottom: 10px; left: 20%; width: 60%; }
  </style>
</head>
<body>
  <div class="x9f1" id="list">
    <div class="k2a zz7"><b>Sam</b><span>Good morning!</span></div>
    <div class="k2a zz7"><b>Sam</b><span>Are you there?</span></div>
    <div class="k2a zz7"><b>Sam</b><span>Let me know when you are free</span></div>
  </div>
  <textarea id="box" placeholder="Message"></textarea>
  <script>
    window.addMessage = (t) => {
      const d = document.createElement('div');
      d.className = 'k2a zz7';
      d.innerHTML = '<b>Sam</b><span></span>';
      d.querySelector('span').textContent = t;
      document.getElementById('list').appendChild(d);
    };
  </script>
</body>
</html>
